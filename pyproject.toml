# -*- coding: utf-8 -*-

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxrens_active_learning"
dynamic = ["version"]
authors = [
    { name = "Nico Unglert", email = "nico.unglert@tuwien.ac.at" }
]
description = "Composition root for jaxrens active-learning projects"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Natural Language :: English"
]
dependencies = [
    "alviz @ git+https://github.com/nunglert/alviz.git@main",
    "ase",
    "scikit-learn",
    "pyyaml",
]
readme = "README.md"

[project.optional-dependencies]
run = [
    "remote_handler[dev,mace_freeze,quests,neuralil,steinhardt] @ git+https://github.com/nunglert/remote_handler.git@main",
    "jaxrens[mace,neuralil,nequix,jaxmd] @ git+https://github.com/nunglert/jaxrens.git@main",
    # phase-grid relaxations (run/phase_grid.py, processors/torchsim_relax.py).
    # torch-sim 0.6 delegates its MACE wrapper to mace.calculators.mace_torchsim
    # (mace-torch >= 0.3.16); 0.5 carries its own, compatible with this env's mace.
    "torch-sim-atomistic>=0.5,<0.6",
    "spglib",
]
refdb = [
    "mp_api",
    "pymatgen",
]
dev = [
    "pytest",
    "pytest-cov",
    "pre-commit",
]
all = [
    "jaxrens_active_learning[dev,run,refdb]"
]

[project.urls]
"Homepage" = "https://github.com/nunglert/jaxrens_active_learning"

[project.scripts]
jaxrens-al = "jaxrens_al.__main__:main"

[tool.setuptools_scm]
# Single source of truth for the version is the git tag (mirrors jaxrens).
# No version file is written; the runtime reads it via importlib.metadata.
# fallback_version keeps the build from erroring on a tagless / shallow clone
# with no git metadata (e.g. an sdist, or a CI checkout without full history).
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jaxrens_al = ["run/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra"
markers = [
    "local: runs with no cluster/producer; always runnable",
    "integration: needs a live cluster or producer packages",
]
