# -*- coding: utf-8 -*-

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxrens_active_learning"
version = "0.1.0"
authors = [
    { name = "Nico Unglert", email = "nico.unglert@tuwien.ac.at" }
]
description = "Composition root for jaxrens active-learning projects"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Natural Language :: English"
]
dependencies = [
    "alviz @ git+ssh://git@gitlab.tuwien.ac.at/e165-03-1_theoretische_materialchemie/madsen-s-research-group/alviz.git@main",
    "ase",
    "scikit-learn",
]
readme = "README.md"

[project.optional-dependencies]
run = [
    "remote_handler[dev,mace_freeze,quests,neuralil] @ git+ssh://git@gitlab.tuwien.ac.at/e165-03-1_theoretische_materialchemie/madsen-s-research-group/remote_handler.git@main",
    "jaxrens[mace,neuralil,nequix,jaxmd] @ git+ssh://git@github.com/nunglert/jaxrens.git@refinement",
]
refdb = [
    "mp_api",
    "pymatgen",
]
dev = [
    "pytest",
    "pytest-cov",
    "pre-commit",
]

[project.scripts]
jaxrens-al-dashboard = "jaxrens_al.cli:main"
jaxrens-al-refdb = "jaxrens_al.reference_db:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jaxrens_al = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra"
markers = [
    "local: runs with no cluster/producer; always runnable",
    "integration: needs a live cluster or producer packages",
]
