# CI for jaxrens_active_learning.
#
# Installs the package with ALL private dependencies and runs the tests. The
# install IS the check: it exercises the real cross-host dependency pipeline
#   * alviz, remote_handler  -> GitLab (same instance) via CI_JOB_TOKEN
#   * jaxrens                -> GitHub via a masked GH_TOKEN
#
# One-time prerequisites:
#   1. Push `alviz` to the madsen GitLab group (its pyproject URL must resolve).
#   2. On `alviz` AND `remote_handler`: Settings -> CI/CD -> Job token
#      permissions -> allow this project's token (add jaxrens_active_learning).
#   3. Settings -> CI/CD -> Variables: add GH_TOKEN (Masked) = a GitHub PAT
#      with read access to nunglert/jaxrens.
#   4. The runner needs outbound network to gitlab.tuwien.ac.at AND github.com.
#
# No custom image is built, so this needs no privileged mode and runs on any
# untagged docker/kubernetes runner. python:3.13 (not -slim) ships git +
# compilers needed to install the git-sourced dependencies.

stages:
  - test

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Full history + tags so setuptools-scm can derive the version (a shallow
  # clone with no tags would fall back to fallback_version = 0.0.0).
  GIT_DEPTH: "0"
  GIT_FETCH_EXTRA_FLAGS: --tags

# Run on branch pushes, merge requests, and scheduled pipelines (the weekly
# cron defined in Build -> Pipeline schedules) -- without duplicate pipelines.
# Scheduled runs are the safety net against silent API drift in the private
# deps (alviz / remote_handler / jaxrens): nothing changed here, but a sibling
# package's main may have moved.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

test:
  stage: test
  image: python:3.13
  before_script:
    # The private deps are pinned as SSH URLs in pyproject (so humans with SSH
    # keys -- dev machines, clusters -- install with zero config). CI has no SSH
    # key, so it rewrites those SSH URLs to authenticated HTTPS at clone time:
    # CI_JOB_TOKEN for the GitLab deps, a masked GH_TOKEN for the GitHub one.
    - git config --global
        url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.tuwien.ac.at/".insteadOf
        "ssh://git@gitlab.tuwien.ac.at/"
    - git config --global
        url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf
        "ssh://git@github.com/"
    - python -V
    - pip install --upgrade pip
    # Full install: alviz + remote_handler (GitLab) + jaxrens (GitHub) + dev.
    - pip install ".[all]"
    - python -c "import jaxrens_al; from jaxrens_al.run.sampler import JaxrensNSSampler; print('install OK')"
  script:
    - pytest -ra --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
