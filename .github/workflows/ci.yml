name: CI

# Installs the package with all its git-sourced dependencies (alviz,
# remote_handler, jaxrens -- all public on GitHub, so no tokens are needed)
# and runs the tests. The install IS the check: it exercises the real
# dependency pipeline.

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run: the safety net against API drift in the sibling packages --
  # nothing changed here, but a dependency's main may have moved.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# A newer push to the same branch/PR supersedes the running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # python:3.13 (not -slim) ships git + compilers needed to install the
    # git-sourced dependencies.
    container: python:3.13
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so setuptools-scm derives the version (a
          # shallow clone would fall back to fallback_version = 0.0.0).
          fetch-depth: 0

      # The checkout is owned by a different uid than the container's root;
      # without this, git (and so setuptools-scm) refuses to read it.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install package with all extras
        run: |
          python -V
          pip install --upgrade pip
          pip install ".[all]"
          python -c "import jaxrens_al; from jaxrens_al.run.sampler import JaxrensNSSampler; print('install OK')"

      - name: Run tests
        run: pytest -ra --junitxml=report.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: report.xml
